[package]
name = "threecrate-python"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Python bindings for threecrate"
# Published to PyPI (as `threecrate`) by maturin, not to crates.io.
publish = false

[lib]
name = "threecrate"
crate-type = ["cdylib"]

[dependencies]
# abi3-py38: one wheel per platform that works on every CPython from 3.8 up,
# instead of a separate wheel for each Python version.
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py38"] }
numpy = "0.22"
nalgebra = { workspace = true }
threecrate-core = { path = "../threecrate-core" }
threecrate-algorithms = { path = "../threecrate-algorithms" }
threecrate-io = { path = "../threecrate-io", features = ["ros2", "compression"] }
threecrate-reconstruction = { path = "../threecrate-reconstruction" }
threecrate-simplification = { path = "../threecrate-simplification" }
