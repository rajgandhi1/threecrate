name: Python

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # One abi3 wheel per platform (works on CPython 3.8+, see
  # threecrate-python/Cargo.toml).
  build:
    name: Build wheel (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          # Built in the manylinux_2_28 container so the wheel installs on
          # glibc 2.28+ (Ubuntu 20.04+, Debian 10+, RHEL 8+), not just on the
          # runner's own glibc.
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64, manylinux: "2_28" }
          # Each Mac wheel is built natively on its own CPU type. Cross-building
          # (e.g. a universal2 wheel on Apple Silicon) fails: the Draco C++
          # dependency (threecrate-io `compression`) refuses to cross-compile.
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin, manylinux: "off" }
          - { name: macos-x86_64, os: macos-15-intel, target: x86_64-apple-darwin, manylinux: "off" }
          - { name: windows-x64, os: windows-latest, target: x64, manylinux: "off" }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: threecrate-python
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.name }}
          path: threecrate-python/dist/

  # Source package, so pip can build from source where no wheel fits.
  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: threecrate-python
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: threecrate-python/dist/

  # Install the built wheels on the oldest and newest Python we test, on every
  # OS, and run a smoke test.
  test:
    name: Test wheel (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: [build]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
        python: ["3.9", "3.13"]

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - name: Install and smoke-test
        shell: bash
        run: |
          pip install numpy
          pip install threecrate --no-index --only-binary=:all: --find-links dist/
          python -c "
          import threecrate as tc
          import numpy as np
          pts = np.random.rand(100, 3).astype(np.float32)
          cloud = tc.PointCloud.from_numpy(pts)
          assert len(cloud) == 100
          cloud2 = tc.voxel_downsample(cloud, 0.1)
          assert len(cloud2) <= len(cloud)
          print('smoke test passed')
          "

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build, sdist, test]
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # PyPI never accepts the same file twice, so without this a rerun
          # after a partial upload would fail on the files already there.
          skip-existing: true
